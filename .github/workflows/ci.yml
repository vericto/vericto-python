# Lint, type-check, test and build on every PR into main and every push to main.
#
# Runners: a private repository runs on Vericto's self-hosted spot runners
# (CI_RUNS_ON overrides them, as in vericto-fmw); a public one always runs on
# GitHub-hosted runners (CI_RUNS_ON_PUBLIC, default "ubuntu-latest"), so a pull
# request from a fork can never reach self-hosted hardware, even if CI_RUNS_ON is
# unset or still points at it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.8"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, a middle one, and the newest.
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Test, with line and branch coverage (fails under 80%)
        env:
          # Covered in their own "extras" job: their framework is not installed here.
          INTEGRATIONS: "*/vericto/langchain.py,*/vericto/llamaindex.py,*/vericto/airflow/*"
        run: |
          uv run coverage run -m pytest
          uv run coverage report --omit="$INTEGRATIONS"

  extras:
    # One job per optional integration, against the framework versions pinned in
    # ci/requirements-*.txt (Airflow through its official constraints file). The
    # core "test" job runs these test files too, where they skip.
    name: Integration (${{ matrix.extra }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langchain
            python: "3.13"
            requirements: ci/requirements-langchain.txt
            tests: tests/test_langchain.py
            covers: src/vericto/langchain.py
            typecheck: src/vericto/langchain.py src/vericto/_agent.py tests/test_langchain.py
          - extra: llamaindex
            python: "3.13"
            requirements: ci/requirements-llamaindex.txt
            tests: tests/test_llamaindex.py
            covers: src/vericto/llamaindex.py
            typecheck: src/vericto/llamaindex.py src/vericto/_agent.py tests/test_llamaindex.py
          - extra: dbt
            python: "3.13"
            requirements: ""
            tests: tests/test_dbt.py
            covers: src/vericto/dbt.py
            typecheck: ""
          - extra: airflow-3.3
            python: "3.13"
            requirements: ci/requirements-airflow-3.txt
            constraints: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt
            tests: tests/test_airflow.py
            covers: src/vericto/airflow/*
            typecheck: src/vericto/airflow tests/test_airflow.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned framework
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          REQUIREMENTS: ${{ matrix.requirements }}
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/extra"
          args=(--python "$RUNNER_TEMP/extra/bin/python" -e .)
          if [ -n "$REQUIREMENTS" ]; then args+=(-r "$REQUIREMENTS"); else args+=(pytest==9.1.1 pytest-httpserver==1.2.0); fi
          if [ -n "$CONSTRAINTS" ]; then args+=(-c "$CONSTRAINTS"); fi
          uv pip install "${args[@]}"
      - name: Test
        env:
          TESTS: ${{ matrix.tests }}
          COVERS: ${{ matrix.covers }}
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow-home"
          # Line and branch coverage of this job's integration module; fails under 80% (pyproject.toml).
          uv pip install --python "$RUNNER_TEMP/extra/bin/python" coverage==7.17.0
          "$RUNNER_TEMP/extra/bin/python" -m coverage run -m pytest $TESTS
          "$RUNNER_TEMP/extra/bin/python" -m coverage report --include="$COVERS"
      - name: Type-check against the real framework
        if: matrix.typecheck != ''
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          TYPECHECK: ${{ matrix.typecheck }}
        run: |
          uv pip install --python "$RUNNER_TEMP/extra/bin/python" mypy==1.20.2
          "$RUNNER_TEMP/extra/bin/python" -m mypy --python-version "$PYTHON_VERSION" --follow-imports=silent $TYPECHECK

  docs:
    # Every python block of the README and docs/frameworks/*.md runs against a local
    # stand-in for the Runtime API (scripts/check_docs.py, scripts/docs_stub.py), with
    # scripted models: no key, no network beyond the package index. "core" runs in the
    # dev environment; each framework guide runs against its pinned versions
    # (ci/requirements-docs-*.txt), with --strict so a missing framework fails.
    name: Docs examples (${{ matrix.guide }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        guide: [core, langchain, llamaindex, django, crewai, openai-agents, pydantic-ai, vanna]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: README, DB-API and SQLAlchemy guides (dev environment)
        if: matrix.guide == 'core'
        run: |
          uv sync --locked
          uv run python scripts/check_docs.py --strict README.md docs/frameworks/dbapi.md docs/frameworks/sqlalchemy.md
      - name: Framework guide against its pinned versions
        if: matrix.guide != 'core'
        env:
          GUIDE: ${{ matrix.guide }}
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/docs"
          uv pip install --python "$RUNNER_TEMP/docs/bin/python" -e . -r "ci/requirements-docs-$GUIDE.txt"
          "$RUNNER_TEMP/docs/bin/python" scripts/check_docs.py --strict "docs/frameworks/$GUIDE.md"

  build:
    name: Build sdist and wheel
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv build
      - name: The wheel carries the type marker and nothing from tests
        run: |
          uv run --no-project --python 3.13 python -m zipfile -l dist/*.whl | tee "$RUNNER_TEMP/wheel.txt"
          grep -q 'vericto/py.typed' "$RUNNER_TEMP/wheel.txt"
          if grep -q 'tests/' "$RUNNER_TEMP/wheel.txt"; then echo "tests/ in the wheel"; exit 1; fi
      - name: Install the wheel in a clean environment and import it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check" dist/*.whl
          "$RUNNER_TEMP/wheel-check"/bin/python -c "import vericto, vericto.sqlite, vericto.dbapi, vericto.dbt; print(vericto.__version__)"
          "$RUNNER_TEMP/wheel-check"/bin/vericto-dbt --version
