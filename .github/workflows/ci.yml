# Lint, type-check, test and build on every PR into main and every push to main.
#
# Runners: a private repository runs on Vericto's self-hosted spot runners
# (CI_RUNS_ON overrides them, as in vericto-fmw); a public one always runs on
# GitHub-hosted runners (CI_RUNS_ON_PUBLIC, default "ubuntu-latest"), so a pull
# request from a fork can never reach self-hosted hardware, even if CI_RUNS_ON is
# unset or still points at it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.8"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, a middle one, and the newest.
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  extras:
    # One job per optional integration, against the framework versions pinned in
    # ci/requirements-*.txt (Airflow through its official constraints file). The
    # core "test" job runs these test files too, where they skip.
    name: Integration (${{ matrix.extra }})
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langchain
            python: "3.13"
            requirements: ci/requirements-langchain.txt
            tests: tests/test_langchain.py
            typecheck: src/vericto/langchain.py src/vericto/_agent.py tests/test_langchain.py
          - extra: llamaindex
            python: "3.13"
            requirements: ci/requirements-llamaindex.txt
            tests: tests/test_llamaindex.py
            typecheck: src/vericto/llamaindex.py src/vericto/_agent.py tests/test_llamaindex.py
          - extra: dbt
            python: "3.13"
            requirements: ""
            tests: tests/test_dbt.py
            typecheck: ""
          - extra: airflow-3.3
            python: "3.13"
            requirements: ci/requirements-airflow-3.txt
            constraints: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt
            tests: tests/test_airflow.py
            typecheck: src/vericto/airflow tests/test_airflow.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned framework
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          REQUIREMENTS: ${{ matrix.requirements }}
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/extra"
          args=(--python "$RUNNER_TEMP/extra/bin/python" -e .)
          if [ -n "$REQUIREMENTS" ]; then args+=(-r "$REQUIREMENTS"); else args+=(pytest==9.1.1 pytest-httpserver==1.1.3); fi
          if [ -n "$CONSTRAINTS" ]; then args+=(-c "$CONSTRAINTS"); fi
          uv pip install "${args[@]}"
      - name: Test
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow-home"
          "$RUNNER_TEMP/extra/bin/python" -m pytest $TESTS
      - name: Type-check against the real framework
        if: matrix.typecheck != ''
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          TYPECHECK: ${{ matrix.typecheck }}
        run: |
          uv pip install --python "$RUNNER_TEMP/extra/bin/python" mypy==1.19.1
          "$RUNNER_TEMP/extra/bin/python" -m mypy --python-version "$PYTHON_VERSION" --follow-imports=silent $TYPECHECK

  build:
    name: Build sdist and wheel
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","vericto-spot"]') || fromJSON(vars.CI_RUNS_ON_PUBLIC || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv build
      - name: The wheel carries the type marker and nothing from tests
        run: |
          uv run --no-project --python 3.13 python -m zipfile -l dist/*.whl | tee "$RUNNER_TEMP/wheel.txt"
          grep -q 'vericto/py.typed' "$RUNNER_TEMP/wheel.txt"
          if grep -q 'tests/' "$RUNNER_TEMP/wheel.txt"; then echo "tests/ in the wheel"; exit 1; fi
      - name: Install the wheel in a clean environment and import it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check" dist/*.whl
          "$RUNNER_TEMP/wheel-check"/bin/python -c "import vericto, vericto.sqlite, vericto.dbapi, vericto.dbt; print(vericto.__version__)"
          "$RUNNER_TEMP/wheel-check"/bin/vericto-dbt --version
