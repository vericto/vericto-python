# Keeps the SHA-pinned GitHub Actions and the locked dev dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  # The framework test environments in ci/ (installed by the "extras" CI job).
  # Airflow and its providers are pinned by the official constraints files the
  # job installs with, so a bump here alone conflicts with them; they move with
  # the constraints URL in ci.yml. These rules also apply to security updates.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "apache-airflow*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ci:
        patterns: ["*"]
