[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vericto"
dynamic = ["version"]
description = "Official Vericto SDK for Python: database guardrails for AI agents, check SQL before it runs. Wrappers for snowflake-connector-python, sqlite3, SQLAlchemy and any DB-API driver; integrations for LangChain, LlamaIndex, dbt and Airflow."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Vericto", email = "security@vericto.com" }]
keywords = ["sql", "firewall", "security", "guardrails", "database-guardrails", "ai-guardrails", "snowflake", "sqlite", "sqlalchemy", "ai-agents", "langchain", "llamaindex", "dbt", "airflow", "vericto"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Security",
  "Typing :: Typed",
]
# urllib3 only: no transitive dependencies, thread-safe connection pooling, and it is
# already installed wherever snowflake-connector-python or requests is.
dependencies = ["urllib3>=1.26.18,<3"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.0"]
sqlalchemy = ["sqlalchemy>=1.4"]
# Integrations. Tested versions: README.
langchain = [
  "langchain-community>=0.3,<0.5",
  "langchain-core>=0.3,<2",
  "sqlalchemy>=1.4",
]
llamaindex = ["llama-index-core>=0.12,<0.15", "sqlalchemy>=1.4"]
# Airflow 3 only: Airflow 2 is end-of-life upstream (README, "Airflow").
airflow = [
  "apache-airflow>=3.0; python_version < '3.15'",
  "apache-airflow-providers-common-sql>=1.14; python_version < '3.15'",
]
# vericto-dbt reads dbt's artifacts and needs no dbt package: the extra is empty.
dbt = []

[project.scripts]
vericto-dbt = "vericto.dbt:console_main"

[project.urls]
Homepage = "https://vericto.com"
Documentation = "https://github.com/vericto/vericto-python#readme"
Source = "https://github.com/vericto/vericto-python"
Changelog = "https://github.com/vericto/vericto-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/vericto/vericto-python/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-httpserver>=1.1",
  "ruff>=0.15",
  "mypy>=1.14",
  "sqlalchemy>=2.0",
  "snowflake-connector-python>=3.12",
  "coverage[toml]>=7.10",
]

[tool.hatch.version]
path = "src/vericto/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/vericto", "tests", "examples", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "TRADEMARKS.md", "SECURITY.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/vericto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::vericto.errors.VerictoFailOpenWarning"]

# Line and branch coverage. CI fails a job under 80%: the core job reports every module
# except the integrations (their framework is not installed there), and each
# integration job reports its own module (.github/workflows/ci.yml).
[tool.coverage.run]
branch = true
source = ["vericto"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "UP006", "UP007", "UP035", "UP045",  # keep typing.Optional/List: the code base's style
  "S311",                              # random is for retry jitter, not security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
# Optional-extra tests import the framework after pytest.importorskip().
"tests/test_{langchain,llamaindex,airflow}.py" = ["E402"]
"examples/**" = ["S101", "S105", "S608"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/vericto", "tests", "examples", "scripts"]

[[tool.mypy.overrides]]
module = ["snowflake.*", "pytest_httpserver.*", "werkzeug.*"]
ignore_missing_imports = true

# The integration frameworks are optional extras, not in the lint environment:
# without them mypy sees their classes as Any. Their own CI jobs type-check these
# modules against the real packages (see .github/workflows/ci.yml).
[[tool.mypy.overrides]]
module = ["langchain_community.*", "langchain_core.*", "langchain_classic.*", "langchain_openai.*", "llama_index.*", "airflow.*", "pydantic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vericto.langchain", "vericto.llamaindex", "vericto.airflow", "vericto.airflow.*", "tests.test_langchain", "tests.test_llamaindex", "tests.test_airflow"]
disallow_subclassing_any = false
disallow_any_unimported = false
warn_return_any = false
